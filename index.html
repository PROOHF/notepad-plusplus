<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Notepad++ magic tricks I use often">
  <title>Notepad++ | Magic tricks</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
</head>

<body>
  <header>
    <div class="bar">
      <div class="search">
        <input id="q" type="search" placeholder="Search shortcuts…" autocomplete="off" aria-label="Search shortcuts">
        <kbd id="hint">Ctrl+K</kbd>
      </div>
      <button class="switch" id="theme" role="switch" aria-checked="false" aria-label="Dark mode"
        title="Toggle light/dark">
        <span class="knob"></span>
        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
        </svg>
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
        </svg>
      </button>
    </div>
  </header>

  <main>
    <h1>Notepad++</h1>
    <p class="lead">Tricks I use often. Click a title or the 🔗 to link straight to it.</p>
    <div class="count" id="count" aria-live="polite"></div>
    <div id="list"></div>
    <div class="empty" id="empty" hidden>Nothing matches your search.</div>
  </main>

  <footer>Code on <a href="https://github.com/PROOHF">GitHub</a> · More stuff at <a
      href="https://www.proohf.com/">proohf.com</a></footer>
  <div class="toast" id="toast"></div>

  <script src="js/scripts.js"></script>

</body>

</html>
